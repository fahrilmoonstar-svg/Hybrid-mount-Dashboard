<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Hybrid Mount</title>
  <style>
    /* ========== RESET & BODY ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0e14;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* ========== CONTAINER LOGIN ========== */
    .login-container {
      text-align: center;
      padding: 40px 30px;
      background: #0d1117;
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      color: #f0f6fc;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.8s ease-out;
      border: 1px solid #21262d;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========== LAMPU ========== */
    .lamp {
      width: 80px;
      height: 80px;
      background: #ffd369;
      border-radius: 50%;
      margin: 0 auto 20px;
      box-shadow: 0 0 30px #ffd369;
      animation: glow 2s infinite alternate ease-in-out;
      transition: box-shadow 0.3s;
    }

    @keyframes glow {
      0% {
        box-shadow: 0 0 20px #ffd369;
        transform: scale(1);
      }
      100% {
        box-shadow: 0 0 60px #ffaa00, 0 0 80px #ff8800;
        transform: scale(1.05);
      }
    }

    /* ========== JUDUL ========== */
    h2 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: #f0f6fc;
    }

    .subtitle {
      color: #8b949e;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    /* ========== INPUT GROUP ========== */
    .input-group {
      position: relative;
      margin: 15px 0;
      display: flex;
      align-items: center;
      background: #161b22;
      border-radius: 10px;
      border: 1px solid #30363d;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .input-group:focus-within {
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
    }

    .input-group .icon {
      padding: 0 12px;
      color: #8b949e;
      font-size: 1.1rem;
    }

    .input-group input {
      width: 100%;
      padding: 12px 12px 12px 0;
      background: transparent;
      border: none;
      color: #f0f6fc;
      font-size: 0.95rem;
      outline: none;
    }

    .input-group input::placeholder {
      color: #484f58;
    }

    .toggle-password {
      padding: 0 12px;
      cursor: pointer;
      color: #8b949e;
      user-select: none;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: #f0f6fc;
    }

    /* ========== TOMBOL LOGIN ========== */
    .login-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: linear-gradient(135deg, #00aaff, #0077ff);
      border: none;
      color: #fff;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
    }

    .login-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 0 25px rgba(0, 170, 255, 0.4);
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    /* ========== PESAN ========== */
    .message {
      margin-top: 15px;
      font-size: 0.9rem;
      min-height: 24px;
      color: #8b949e;
    }

    .message.error {
      color: #f85149;
    }

    .message.success {
      color: #3fb950;
    }

    /* ========== FOOTER ========== */
    .footer {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #484f58;
    }

    .footer a {
      color: #58a6ff;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <!-- Lampu -->
    <div class="lamp"></div>

    <!-- Judul -->
    <h2>Welcome Back</h2>
    <p class="subtitle">Login ke Hybrid Mount Dashboard</p>

    <!-- Form -->
    <form id="loginForm" autocomplete="off">
      <div class="input-group">
        <span class="icon">👤</span>
        <input type="text" id="username" placeholder="Username" required />
      </div>

      <div class="input-group">
        <span class="icon">🔒</span>
        <input type="password" id="password" placeholder="Password" required />
        <span class="toggle-password" id="togglePass">👁️</span>
      </div>

      <button type="submit" class="login-btn">Login</button>
    </form>

    <!-- Pesan -->
    <div id="message" class="message"></div>

    <!-- Footer -->
    <div class="footer">
      <a href="#">Lupa password?</a> · <a href="#">Daftar</a>
    </div>
  </div>

  <script>
    // ============ ELEMEN ============
    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const togglePass = document.getElementById('togglePass');
    const messageEl = document.getElementById('message');

    // ============ TOGGLE PASSWORD ============
    togglePass.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePass.textContent = isPassword ? '🙈' : '👁️';
    });

    // ============ VALIDASI & SUBMIT ============
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      messageEl.textContent = '';
      messageEl.className = 'message';

      if (!username || !password) {
        messageEl.textContent = '⚠️ Username dan password harus diisi!';
        messageEl.className = 'message error';
        return;
      }

      // ============ LOGIN SIMULASI ============
      if (username === 'admin' && password === 'admin123') {
        messageEl.textContent = '✅ Login berhasil! Mengalihkan...';
        messageEl.className = 'message success';

        // Redirect ke dashboard setelah 1 detik
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      } else {
        messageEl.textContent = '❌ Username atau password salah!';
        messageEl.className = 'message error';
      }
    });

    // Hilangkan pesan error saat mengetik
    usernameInput.addEventListener('input', () => {
      if (messageEl.classList.contains('error')) {
        messageEl.textContent = '';
        messageEl.className = 'message';
      }
    });

    passwordInput.addEventListener('input', () => {
      if (messageEl.classList.contains('error')) {
        messageEl.textContent = '';
        messageEl.className = 'message';
      }
    });
  </script>
</body>
</html>
