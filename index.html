<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Hybrid Mount</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">
  <div class="login-container">
    <div class="lamp"></div>
    <h2>Welcome Back</h2>
    <p class="subtitle">Login ke Hybrid Mount Dashboard</p>

    <form id="loginForm" autocomplete="off">
      <div class="input-group">
        <span class="icon">👤</span>
        <input type="text" id="username" placeholder="Username" required />
      </div>

      <div class="input-group">
        <span class="icon">🔒</span>
        <input type="password" id="password" placeholder="Password" required />
        <span class="toggle-password" id="togglePass">👁️</span>
      </div>

      <button type="submit" class="login-btn">Login</button>
    </form>

    <div id="message" class="message"></div>

    <!-- SPONSOR JASTIPBYLULUS -->
    <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #30363d;">
      <p style="font-size: 0.8rem; color: #8b949e;">
        🤝 Support by 
        <a href="https://jastipbylulus.com" target="_blank" style="color: #ffd369; text-decoration: none; font-weight: 600;">
          JastipByLulus
        </a>
      </p>
    </div>

    <div class="login-footer">
      <a href="#">Lupa password?</a> · <a href="#">Daftar</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
