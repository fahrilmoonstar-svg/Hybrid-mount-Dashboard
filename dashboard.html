<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hybrid Mount Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dashboard-body">
  <div id="app">
    <header class="dashboard-header">
      <h1>🔧 Hybrid Mount Dashboard</h1>
      <div class="header-right">
        <nav class="nav-tabs">
          <button class="tab-btn active" data-tab="modules">📦 Modules</button>
          <button class="tab-btn" data-tab="traffic">🚦 Traffic Light</button>
          <button class="tab-btn" data-tab="blacklist">🚫 Blacklist</button>
          <button id="loopModulesBtn" class="tab-btn" style="border-bottom-color: #ffd369; color: #ffd369;">
            🔄 Log Modules
          </button>
        </nav>
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </header>

    <main>
      <section id="modules" class="tab-content active">
        <h2>📦 Installed Modules</h2>
        <div id="moduleList" class="grid"></div>
      </section>

      <section id="traffic" class="tab-content">
        <h2>🚦 Simulasi Lampu Lalu Lintas</h2>
        <div class="traffic-container">
          <div class="traffic-light">
            <div class="light" id="light">✅</div>
          </div>
          <div id="statusMessage" class="status-text hijau">Jalan!</div>
          <div class="controls">
            <button class="btn red" data-color="merah">🔴 Merah</button>
            <button class="btn yellow" data-color="kuning">🟡 Kuning</button>
            <button class="btn green" data-color="hijau">🟢 Hijau</button>
          </div>
          <button id="autoCycle" class="auto-btn">🔄 Auto Cycle (6x)</button>
        </div>
      </section>

      <section id="blacklist" class="tab-content">
        <h2>🚫 Global Blacklist</h2>
        <ul id="blacklistList" class="blacklist"></ul>
      </section>
    </main>

    <footer class="dashboard-footer">
      Hybrid Mount v6.0.0 — Built with Vanilla JS
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
